# Database tests, for whoever adds the first pgTAP test.
#
# GitHub's runners ship with Docker, so the full Supabase stack works here even
# for teammates who cannot run Docker on their own laptop.
#
# To turn this on: write tests in supabase/tests/*.sql, then delete the "#" from
# the start of each line below.
