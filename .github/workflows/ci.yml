#
# Good first tests, each one a bug that has already happened:
#   - a blocked person never appears in the blocker's deck
#   - a blocked person cannot insert into the existing DM
#   - a non-columbia.edu address is rejected by the database, not just the UI
#   - dropping a section removes chat membership but leaves DMs intact
#   - deleting an account frees the email and removes the other side's thread
#   - a pending friend request does not silently drop that person from the deck
